name: GitHub Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - uses: Ashutosh00710/github-readme-activity-graph@master
        with:
          USERNAME: shlok926
          THEME: react-dark
          
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add github-contribution-activity-graph.svg
          git commit -m "Update activity graph" || exit 0
          git push
